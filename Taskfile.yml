# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv: [.env]

vars:
  TIMESTAMP: '{{now | date "2006-01-02T15:04:05Z07:00"}}'

  GIT_VERSION: { sh: "git describe --tags --always --dirty" }
  GIT_COMMIT: { sh: "git rev-parse --short HEAD" }

  AQUA: '{{.AQUA | default "aqua"}}'
  AQUA_ROOT: { sh: "{{.AQUA}} root-dir" }

  DOCKER: '{{.DOCKER | default "docker"}}'
  DOCKER_COMPOSE: '{{.DOCKER_COMPOSE | default (printf "%s compose" .DOCKER)}}'

  API:
    map:
      BUILD:
        VERSION: '{{.GIT_VERSION | default "dev"}}'
        COMMIT: '{{.GIT_COMMIT | default "unknown"}}'
        TIMESTAMP: '{{.TIMESTAMP | default "unknown"}}'
      OPENAPI_SPEC: '{{.API_OPENAPI_SPEC | default "./api/openapi.yml"}}'

env:
  PATH: "{{.AQUA_ROOT}}/bin:{{.PATH}}"

includes:
  db:
    dir: ./db
    taskfile: ./db/Taskfile.yml

  api:
    dir: ./api
    taskfile: ./api/Taskfile.yml
    vars:
      OPENAPI_SPEC: '{{relPath "./api" .API.OPENAPI_SPEC}}'

  web:
    dir: ./web
    taskfile: ./web/Taskfile.yml
    vars:
      BACKEND_OPENAPI_SPEC: '{{relPath "./web" .API.OPENAPI_SPEC}}'

tasks:
  # Agents

  skills:sync:
    desc: Synchronize dependencies
    cmd: npx skills experimental_install -y

  # Containers

  run:docker:*:*:
    internal: true
    vars:
      COMMAND: "{{index .MATCH 0}}"
      SERVICE: "{{index .MATCH 1}}"
      SHORTCUTS:
        map:
          detach: "up -d"
          rebuild: "build"
          wait: "up -d --wait"
          flogs: "logs -f"
          clean: "down -v"

  docker:stop:
    desc: Stop all services
    cmd: { task: "run:docker:stop:" }

  docker:down:
    desc: Bring down all services
    cmd: { task: "run:docker:down:" }

  docker:logs:
    desc: Follow logs of all services
    cmd: { task: "run:docker:flogs" }

  docker:ps:
    desc: Show status of all services
    cmd: { task: "run:docker:ps" }

  docker:*:*:
    internal: true
    label: "docker:{{if .SERVICE}}{{.SERVICE}}:{{end}}{{.COMMAND}}"
    desc: Run a specific docker command on a specific service
    vars:
      SERVICE: "{{index .MATCH 0}}"
      COMMAND: "{{index .MATCH 1}}"
      COMMAND_SHORTCUTS:
        map:
          detach: "up -d"
          rebuild: "build"
          wait: "up -d --wait"
          flogs: "logs -f"
          clean: "down -v"
    cmd: >-
      {{- $command := index .COMMAND_SHORTCUTS .COMMAND | default .COMMAND -}}
      {{- $args := printf "%s %s" $command .SERVICE | trim -}}
      {{.DOCKER_COMPOSE}} {{$args}}

  # Service Commands

  db:up: &service-up
    desc: Start service in container
    vars: &service-vars
      NAMESPACE: '{{index (splitList ":" .TASK) 0 | upper}}'
      SERVICE: "{{(index .CONFIG .NAMESPACE).DOCKER_SERVICE}}"
    cmd: { task: "docker:{{.SERVICE}}:detach" }

  db:logs: &service-logs
    vars: *service-vars
    desc: Follow service container logs
    cmd: { task: "docker:{{.SERVICE}}:flogs" }

  db:reset:
    vars: *service-vars
    desc: Reset service container
    cmds:
      - { task: "docker:{{.SERVICE}}:clean" }
      - { task: "docker:{{.SERVICE}}:detach" }

  api:service:build:
    vars: *service-vars
    env:
      API_VERSION: "{{.VERSION}}"
      API_COMMIT: "{{.COMMIT}}"
      API_BUILDTIME: "{{.TIMESTAMP}}"
    desc: Rebuild service container
    cmd: { task: "docker:{{.SERVICE}}:build" }

  api:up: *service-up
  api:logs: *service-logs

  web:up: *service-up
  web:logs: *service-logs

  # Meta Commands

  completions:
    desc: Generate shell completions for dev tools
    requires:
      vars:
        - { name: SHELL_TARGET, enum: [bash, zsh] }
        - { name: COMPLETIONS_DIR }
    vars:
      SHELL_TARGET:    "{{index .CLI_ARGS_LIST 0}}"
      COMPLETIONS_DIR: "{{index .CLI_ARGS_LIST 1}}"
      FILENAME_FMT: '{{if (eq .SHELL_TARGET "zsh") "_%s" "%s"}}'
      COMMANDS:
        map:
          AQUA: { NAME: aqua, ARGS: "completion {{.SHELL_TARGET}}" }
          TASK: { NAME: task, ARGS: "--completion {{.SHELL_TARGET}}" }
    cmd:
      for: { var: COMMANDS, as: COMMAND }
      cmd: >-
        {{- $name := printf .FILENAME_FMT .COMMAND.NAME -}}
        {{- $cmd  := printf "%s %s" .COMMAND.NAME .COMMAND.ARGS -}}
        {{- $path := joinPath .COMPLETIONS_DIR $name -}}
        {{$cmd}} > {{$path|q}}
