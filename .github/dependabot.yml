version: 2
updates:
  - package-ecosystem: "docker"
    directories: ["/api", "/web"]
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 1

  - package-ecosystem: "gomod"
    directory: "/api"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 1

  - package-ecosystem: "npm"
    directory: "/web"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 1
