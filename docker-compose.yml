name: pitchondb

services:
  api:
    build:
      context: api
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: on-failure
    depends_on: [ postgres ]
    environment:
      SERVICE_APP_ENV: ${APP_ENV:-production}
      SERVICE_APP_DEBUG: ${APP_DEBUG:-false}
      SERVICE_POSTGRES_HOST: postgres
      SERVICE_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      SERVICE_POSTGRES_USER: ${POSTGRES_USER:-pitchondb}
      SERVICE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitchondb}
      SERVICE_POSTGRES_DB: ${POSTGRES_DB:-pitchondb}
      SERVICE_POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
    expose: [ 8080 ]
    healthcheck:
      test: ["CMD-SHELL", "/bin/pitchondb healthcheck"]
      interval: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: runner
    restart: on-failure
    depends_on: [ api ]
    ports: [ 80:80 ]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pitchondb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitchondb}
      POSTGRES_DB: ${POSTGRES_DB:-pitchondb}
    ports: [ "${POSTGRES_PORT:-5432}:5432" ]
    volumes: [ postgres-data:/var/lib/postgresql/data ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitchondb}"]
      interval: 5s
      retries: 5

volumes:
  postgres-data:
